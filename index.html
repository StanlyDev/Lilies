<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; padding: 0; background: #000; }

  .vs-section {
    position: relative;
    height: 200vh;
  }
  .vs-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    background: #000;
  }
  #frame-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #scroll-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.6s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container_mouse {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
  }
  .mouse-btn {
    margin: 0 auto;
    width: 40px;
    height: 80px;
    border: 3px solid #fff;
    border-radius: 20px;
    display: flex;
  }
  .mouse-scroll {
    display: block;
    width: 20px;
    height: 20px;
    background: linear-gradient(170deg, #fff, #ccc);
    border-radius: 50%;
    margin: auto;
    animation: scrolling13 1s linear infinite;
  }
  @keyframes scrolling13 {
    0%   { opacity: 0; transform: translateY(-20px); }
    100% { opacity: 1; transform: translateY(20px); }
  }

  /* En móvil el hint queda un poco más alto para no chocar con la barra del navegador */
  @media (max-width: 768px) {
    #scroll-hint {
      bottom: 3.5rem;
    }
    .mouse-btn {
      width: 32px;
      height: 64px;
    }
    .mouse-scroll {
      width: 16px;
      height: 16px;
    }
  }
</style>
</head>
<body>

<div class="vs-section" id="vs-section">
  <div class="vs-sticky" id="vs-sticky">
    <canvas id="frame-canvas"></canvas>

    <div id="scroll-hint">
      <div class="container_mouse">
        <span class="mouse-btn">
          <span class="mouse-scroll"></span>
        </span>
        <span>Scroll Down</span>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  const BASE_URL  = '/img/Lilies1/Lilies1_';
  const EXT       = '.jpg';
  const TOTAL     = 270;
  const PAD       = 3;
  const LOOKAHEAD = 15;

  const canvas  = document.getElementById('frame-canvas');
  const ctx     = canvas.getContext('2d');
  const section = document.getElementById('vs-section');
  const sticky  = document.getElementById('vs-sticky');
  const hint    = document.getElementById('scroll-hint');

  const frames = new Array(TOTAL + 1);
  let currentFrame = 1;
  let rafPending   = false;

  /* ── utilidades ─────────────────────────────────────── */
  function pad(n) { return String(n).padStart(PAD, '0'); }
  function url(i) { return BASE_URL + pad(i) + EXT; }

  /* ── dibujo con cover-fit ────────────────────────────── */
  function drawFrame(img) {
    if (!img || !img.complete || !img.naturalWidth) return;
    const cw = canvas.width,  ch = canvas.height;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.max(cw / iw, ch / ih);   // cover
    const sw = iw * scale, sh = ih * scale;
    const sx = (cw - sw) / 2, sy = (ch - sh) / 2;
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, sx, sy, sw, sh);
  }

  /* ── resize: recalcula canvas y redibuja ─────────────── */
  function resizeCanvas() {
    canvas.width  = sticky.offsetWidth;
    canvas.height = sticky.offsetHeight;
    if (frames[currentFrame] && frames[currentFrame].complete) {
      drawFrame(frames[currentFrame]);
    }
  }

  // ResizeObserver cubre tanto resize de ventana como cambio de orientación
  const ro = new ResizeObserver(resizeCanvas);
  ro.observe(sticky);
  resizeCanvas();

  /* ── precarga ────────────────────────────────────────── */
  function preloadRange(from, to, onDone) {
    let count = to - from + 1;
    for (let i = from; i <= to; i++) {
      if (frames[i]) { if (--count === 0 && onDone) onDone(); continue; }
      const img = new Image();
      img.onload = img.onerror = function () {
        if (--count === 0 && onDone) onDone();
      };
      img.src = url(i);
      frames[i] = img;
    }
  }

  preloadRange(1, Math.min(30, TOTAL), function () {
    if (frames[1]) drawFrame(frames[1]);
  });
  preloadRange(31, TOTAL);

  /* ── scroll ──────────────────────────────────────────── */
  function onScroll() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;

      const rect     = section.getBoundingClientRect();
      const traveled = -rect.top;
      const total    = rect.height - window.innerHeight;
      const progress = Math.min(Math.max(traveled / total, 0), 1);
      const idx      = Math.min(Math.round(progress * (TOTAL - 1)) + 1, TOTAL);

      // Oculta el hint en cuanto empieza el scroll
      if (hint) hint.style.opacity = progress > 0.02 ? '0' : '1';

      if (idx !== currentFrame) {
        currentFrame = idx;

        // precarga lookahead
        const ahead = Math.min(idx + LOOKAHEAD, TOTAL);
        for (let i = idx; i <= ahead; i++) {
          if (!frames[i]) {
            const img = new Image();
            img.src = url(i);
            frames[i] = img;
          }
        }

        const target = frames[idx];
        if (target && target.complete) {
          drawFrame(target);
        } else if (target) {
          target.onload = function () { drawFrame(target); };
        }
      }
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });

  // orientationchange también dispara resize, pero por si acaso
  window.addEventListener('orientationchange', function () {
    setTimeout(resizeCanvas, 200);
  });

  onScroll();
})();
</script>

</body>
</html>

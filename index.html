<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #060608; }
  body { margin: 0; padding: 0; background: #060608; }

  /* Reduje a 800vh. 1200vh para 9 líneas es un exceso, pruébalo y ajústalo */
  .vs-section {
    position: relative;
    height: 800vh; 
    background: #060608;
  }
  .vs-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    background: #060608;
  }
  #frame-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #060608;
  }

  /* Contenedor del poema */
  #poem-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    max-width: 600px;
    text-align: center;
    pointer-events: none; /* Para que no bloquee el click o scroll */
    z-index: 5;
  }

  .poem-line {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    font-family: 'Dancing Script', cursive;
    font-size: 2.5rem;
    color: #fff;
    opacity: 0;
    white-space: nowrap;
    /* Sombra fuerte para asegurar legibilidad contra las fotos */
    text-shadow: 2px 2px 8px rgba(0,0,0,0.9), 0px 0px 4px rgba(0,0,0,0.8);
    /* Clip path simulará la escritura. Empieza todo oculto */
    clip-path: inset(0 100% 0 0);
  }

  #scroll-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.6s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container_mouse {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
  }
  .mouse-btn {
    margin: 0 auto;
    width: 40px;
    height: 80px;
    border: 3px solid #fff;
    border-radius: 20px;
    display: flex;
  }
  .mouse-scroll {
    display: block;
    width: 20px;
    height: 20px;
    background: linear-gradient(170deg, #fff, #ccc);
    border-radius: 50%;
    margin: auto;
    animation: scrolling13 1s linear infinite;
  }
  @keyframes scrolling13 {
    0%   { opacity: 0; transform: translateY(-20px); }
    100% { opacity: 1; transform: translateY(20px); }
  }

  @media (max-width: 768px) {
    #scroll-hint { bottom: 3.5rem; }
    .mouse-btn   { width: 32px; height: 64px; }
    .mouse-scroll{ width: 16px; height: 16px; }
    .poem-line { font-size: 1.8rem; white-space: normal; }
  }
</style>
</head>
<body>

<div class="vs-section" id="vs-section">
  <div class="vs-sticky" id="vs-sticky">
    <canvas id="frame-canvas"></canvas>

    <div id="poem-container">
      <div class="poem-line">No floreces para complacer al ojo ajeno.</div>
      <div class="poem-line">Te alzas en el fango,</div>
      <div class="poem-line">vistes tu tallo de gala,</div>
      <div class="poem-line">y abres tus pétalos de terciopelo morado</div>
      <div class="poem-line">ante el frío de la tarde.</div>
      <div class="poem-line">Eres el lirio que no pide permiso,</div>
      <div class="poem-line">el que convierte la sombra en color</div>
      <div class="poem-line">y el silencio en belleza.</div>
      <div class="poem-line">— Anónimo</div>
    </div>

    <div id="scroll-hint">
      <div class="container_mouse">
        <span class="mouse-btn">
          <span class="mouse-scroll"></span>
        </span>
        <span>Scroll</span>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  const BASE_URL  = '/img/Lilies2/Lilies2_';
  const EXT       = '.jpg';
  const TOTAL     = 270;
  const PAD       = 3;
  const LOOKAHEAD = 15;

  const canvas  = document.getElementById('frame-canvas');
  const ctx     = canvas.getContext('2d');
  const section = document.getElementById('vs-section');
  const sticky  = document.getElementById('vs-sticky');
  const hint    = document.getElementById('scroll-hint');
  const poemLines = document.querySelectorAll('.poem-line');

  const frames = new Array(TOTAL + 1);
  let currentFrame = 1;
  let rafPending   = false;
  let dpr          = window.devicePixelRatio || 1;

  function pad(n) { return String(n).padStart(PAD, '0'); }
  function url(i) { return BASE_URL + pad(i) + EXT; }

  function drawFrame(img) {
    if (!img || !img.complete || !img.naturalWidth) return;
    const cw = canvas.width,  ch = canvas.height;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.max(cw / iw, ch / ih);
    const sw = iw * scale, sh = ih * scale;
    const sx = (cw - sw) / 2, sy = (ch - sh) / 2;
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, sx, sy, sw, sh);
  }

  function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    const cssW = sticky.offsetWidth;
    const cssH = sticky.offsetHeight;
    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    if (frames[currentFrame] && frames[currentFrame].complete) {
      drawFrame(frames[currentFrame]);
    }
  }

  const ro = new ResizeObserver(resizeCanvas);
  ro.observe(sticky);
  resizeCanvas();

  function preloadRange(from, to, onDone) {
    let count = to - from + 1;
    for (let i = from; i <= to; i++) {
      if (frames[i]) { if (--count === 0 && onDone) onDone(); continue; }
      const img = new Image();
      img.onload = img.onerror = function () {
        if (--count === 0 && onDone) onDone();
      };
      img.src = url(i);
      frames[i] = img;
    }
  }

  preloadRange(1, Math.min(30, TOTAL), function () {
    if (frames[1]) drawFrame(frames[1]);
  });
  preloadRange(31, TOTAL);

  function onScroll() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;

      const rect     = section.getBoundingClientRect();
      const traveled = -rect.top;
      const total    = rect.height - window.innerHeight;
      const progress = Math.min(Math.max(traveled / total, 0), 1);
      const idx      = Math.min(Math.round(progress * (TOTAL - 1)) + 1, TOTAL);

      if (hint) hint.style.opacity = progress > 0.02 ? '0' : '1';

      // Lógica de Canvas
      if (idx !== currentFrame) {
        currentFrame = idx;
        const ahead = Math.min(idx + LOOKAHEAD, TOTAL);
        for (let i = idx; i <= ahead; i++) {
          if (!frames[i]) {
            const img = new Image();
            img.src = url(i);
            frames[i] = img;
          }
        }
        const target = frames[idx];
        if (target && target.complete) {
          drawFrame(target);
        } else if (target) {
          target.onload = function () { drawFrame(target); };
        }
      }

      // Lógica del Poema - Vinculado estrictamente al progreso
      const numLines = poemLines.length;
      // Dividimos el scroll total en segmentos iguales para cada línea
      const currentSegment = progress * numLines;
      const activeLineIndex = Math.floor(currentSegment);

      poemLines.forEach((line, index) => {
        if (index === activeLineIndex) {
          // Línea actual: calculamos su progreso interno (de 0 a 1)
          const localProgress = currentSegment - index;
          line.style.opacity = 1;
          
          // Fase 1: Escritura (0% al 40% del segmento)
          // Fase 2: Pausa visible (40% al 80% del segmento)
          // Fase 3: Desvanecimiento (80% al 100% del segmento)
          
          if (localProgress < 0.4) {
             const typingProgress = (localProgress / 0.4) * 100;
             line.style.clipPath = `inset(0 ${100 - typingProgress}% 0 0)`;
             line.style.opacity = 1;
          } else if (localProgress >= 0.4 && localProgress < 0.8) {
             line.style.clipPath = `inset(0 0 0 0)`;
             line.style.opacity = 1;
          } else {
             line.style.clipPath = `inset(0 0 0 0)`;
             const fadeOutProgress = (localProgress - 0.8) / 0.2;
             line.style.opacity = 1 - fadeOutProgress;
          }

        } else {
          // Ocultar líneas que no están activas
          line.style.opacity = 0;
          line.style.clipPath = `inset(0 100% 0 0)`;
        }
      });
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('orientationchange', function () {
    setTimeout(resizeCanvas, 200);
  });

  onScroll();
})();
</script>

</body>
</html>

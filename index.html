<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #060608; }
  body { margin: 0; padding: 0; background: #060608; }

  /* --- SECCIÓN PARALLAX --- */
  .vs-section {
    position: relative;
    height: 800vh; 
    background: #060608;
  }
  .vs-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    background: #060608;
  }
  #frame-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #060608;
  }

  /* Contenedor del poema principal */
  #poem-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    max-width: 600px;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }

  .poem-line {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    font-family: 'Dancing Script', cursive;
    font-size: 2.5rem;
    color: #fff;
    opacity: 0;
    white-space: nowrap;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.9), 0px 0px 4px rgba(0,0,0,0.8);
    clip-path: inset(0 100% 0 0);
  }

  #scroll-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.6s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container_mouse {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
  }
  .mouse-btn {
    margin: 0 auto;
    width: 40px;
    height: 80px;
    border: 3px solid #fff;
    border-radius: 20px;
    display: flex;
  }
  .mouse-scroll {
    display: block;
    width: 20px;
    height: 20px;
    background: linear-gradient(170deg, #fff, #ccc);
    border-radius: 50%;
    margin: auto;
    animation: scrolling13 1s linear infinite;
  }
  @keyframes scrolling13 {
    0%   { opacity: 0; transform: translateY(-20px); }
    100% { opacity: 1; transform: translateY(20px); }
  }

  /* --- SECCIÓN EPÍLOGO (POEMAS ALEATORIOS) --- */
  .epilogue-section {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #060608;
    z-index: 20;
    padding: 2rem;
    box-sizing: border-box;
  }

  .poem-card {
    text-align: center;
    max-width: 600px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
  }

  #random-poem {
    font-family: 'Dancing Script', cursive;
    font-size: 2rem;
    color: #e0e0e0;
    line-height: 1.5;
    min-height: 200px; 
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease;
  }

  #btn-next-poem {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff;
    padding: 12px 30px;
    font-family: sans-serif;
    font-size: 0.9rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 30px;
    transition: all 0.3s ease;
  }

  #btn-next-poem:hover {
    background: #fff;
    color: #060608;
  }

  .fade-out { opacity: 0 !important; }

  @media (max-width: 768px) {
    #scroll-hint { bottom: 3.5rem; }
    .mouse-btn   { width: 32px; height: 64px; }
    .mouse-scroll{ width: 16px; height: 16px; }
    .poem-line { font-size: 1.8rem; white-space: normal; }
    #random-poem { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="vs-section" id="vs-section">
  <div class="vs-sticky" id="vs-sticky">
    <canvas id="frame-canvas"></canvas>

    <div id="poem-container">
      <div class="poem-line">No floreces para complacer al ojo ajeno.</div>
      <div class="poem-line">Te alzas en el fango,</div>
      <div class="poem-line">vistes tu tallo de gala,</div>
      <div class="poem-line">y abres tus pétalos de terciopelo morado</div>
      <div class="poem-line">ante el frío de la tarde.</div>
      <div class="poem-line">Eres el lirio que no pide permiso,</div>
      <div class="poem-line">el que convierte la sombra en color</div>
      <div class="poem-line">y el silencio en belleza.</div>
      <div class="poem-line">— Anónimo</div>
    </div>

    <div id="scroll-hint">
      <div class="container_mouse">
        <span class="mouse-btn">
          <span class="mouse-scroll"></span>
        </span>
        <span>Scroll</span>
      </div>
    </div>
  </div>
</div>

<div class="epilogue-section" id="epilogue">
  <div class="poem-card">
    <p id="random-poem">
      Un Lirio<br>
      Para mi delirio....
    </p>
    <button id="btn-next-poem">Pulsa aqui, para mas cositas lindas</button>
  </div>
</div>

<script>
(function () {
  /* ── LÓGICA DEL PARALLAX Y CANVAS ── */
  const BASE_URL  = '/img/Lilies2/Lilies2_';
  const EXT       = '.jpg';
  const TOTAL     = 270;
  const PAD       = 3;
  const LOOKAHEAD = 15;

  const canvas  = document.getElementById('frame-canvas');
  const ctx     = canvas.getContext('2d');
  const section = document.getElementById('vs-section');
  const sticky  = document.getElementById('vs-sticky');
  const hint    = document.getElementById('scroll-hint');
  const poemLines = document.querySelectorAll('.poem-line');

  const frames = new Array(TOTAL + 1);
  let currentFrame = 1;
  let rafPending   = false;
  let dpr          = window.devicePixelRatio || 1;

  function pad(n) { return String(n).padStart(PAD, '0'); }
  function url(i) { return BASE_URL + pad(i) + EXT; }

  function drawFrame(img) {
    if (!img || !img.complete || !img.naturalWidth) return;
    const cw = canvas.width,  ch = canvas.height;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.max(cw / iw, ch / ih);
    const sw = iw * scale, sh = ih * scale;
    const sx = (cw - sw) / 2, sy = (ch - sh) / 2;
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, sx, sy, sw, sh);
  }

  function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    const cssW = sticky.offsetWidth;
    const cssH = sticky.offsetHeight;
    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    if (frames[currentFrame] && frames[currentFrame].complete) {
      drawFrame(frames[currentFrame]);
    }
  }

  const ro = new ResizeObserver(resizeCanvas);
  ro.observe(sticky);
  resizeCanvas();

  function preloadRange(from, to, onDone) {
    let count = to - from + 1;
    for (let i = from; i <= to; i++) {
      if (frames[i]) { if (--count === 0 && onDone) onDone(); continue; }
      const img = new Image();
      img.onload = img.onerror = function () {
        if (--count === 0 && onDone) onDone();
      };
      img.src = url(i);
      frames[i] = img;
    }
  }

  preloadRange(1, Math.min(30, TOTAL), function () {
    if (frames[1]) drawFrame(frames[1]);
  });
  preloadRange(31, TOTAL);

  function onScroll() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;

      const rect     = section.getBoundingClientRect();
      const traveled = -rect.top;
      const total    = rect.height - window.innerHeight;
      const progress = Math.min(Math.max(traveled / total, 0), 1);
      const idx      = Math.min(Math.round(progress * (TOTAL - 1)) + 1, TOTAL);

      if (hint) hint.style.opacity = progress > 0.02 ? '0' : '1';

      if (idx !== currentFrame) {
        currentFrame = idx;
        const ahead = Math.min(idx + LOOKAHEAD, TOTAL);
        for (let i = idx; i <= ahead; i++) {
          if (!frames[i]) {
            const img = new Image();
            img.src = url(i);
            frames[i] = img;
          }
        }
        const target = frames[idx];
        if (target && target.complete) {
          drawFrame(target);
        } else if (target) {
          target.onload = function () { drawFrame(target); };
        }
      }

      const numLines = poemLines.length;
      const currentSegment = progress * numLines;
      const activeLineIndex = Math.floor(currentSegment);

      poemLines.forEach((line, index) => {
        if (index === activeLineIndex) {
          const localProgress = currentSegment - index;
          line.style.opacity = 1;
          
          if (localProgress < 0.4) {
             const typingProgress = (localProgress / 0.4) * 100;
             line.style.clipPath = `inset(0 ${100 - typingProgress}% 0 0)`;
             line.style.opacity = 1;
          } else if (localProgress >= 0.4 && localProgress < 0.8) {
             line.style.clipPath = `inset(0 0 0 0)`;
             line.style.opacity = 1;
          } else {
             line.style.clipPath = `inset(0 0 0 0)`;
             const fadeOutProgress = (localProgress - 0.8) / 0.2;
             line.style.opacity = 1 - fadeOutProgress;
          }
        } else {
          line.style.opacity = 0;
          line.style.clipPath = `inset(0 100% 0 0)`;
        }
      });
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('orientationchange', function () {
    setTimeout(resizeCanvas, 200);
  });

  onScroll();

  /* ── LÓGICA DEL GENERADOR DE POEMAS ALEATORIOS ── */
  const poems = [
    "Desnuda eres tan simple como una de tus manos:<br>lisa, terrestre, mínima, redonda, transparente.<br>— Pablo Neruda",
    "Eres la belleza que no se explica,<br>el misterio que detiene el tiempo,<br>y la luz que no ciega, pero ilumina.<br>— Anónimo",
    "¿Qué es poesía?, dices mientras clavas<br>en mi pupila tu pupila azul.<br>¡Qué es poesía! ¿Y tú me lo preguntas?<br>Poesía... eres tú.<br>— Gustavo Adolfo Bécquer",
    "Rosa divina que en gentil cultura<br>eres con tu fragante sutileza<br>magisterio purpúreo en la belleza.<br>— Sor Juana Inés de la Cruz",
    "Hay en tu gracia un eco de otro mundo,<br>un no sé qué de estrella fugitiva,<br>que hace que al mirarte, la vida cobre sentido.<br>— Anónimo",
    "Tu caminar es como el oleaje manso,<br>no busca romper la roca,<br>solo acaricia la orilla dejándola perfecta.<br>— Anónimo",
    "Como la brisa que no se ve pero se siente,<br>así es tu sola presencia:<br>un arte silencioso que todo lo embellece.<br>— Anónimo",
    "No hay simetría en este mundo que iguale<br>la extraña y perfecta manera<br>en la que existes, simplemente.<br>— Anónimo",
    "Si el universo tuviera rostro,<br>buscaría robarte los gestos<br>para entender cómo ser infinito.<br>— Anónimo",
    "Bendita tu luz y la sombra que proyectas,<br>porque hasta la nada se viste de gala<br>cuando pasas junto a ella.<br>— Anónimo",
    "Eres como una biblioteca en llamas:<br>fascinante, destructiva, hermosa,<br>e imposible de ignorar.<br>— Anónimo",
    "Llevas la primavera en los pasos<br>y el invierno no se atreve a tocar<br>la tierra por donde caminas.<br>— Anónimo",
    "Tu belleza no es de las que gritan,<br>es de las que susurran y dejan sordo<br>al que no sabe escuchar con los ojos.<br>— Anónimo",
    "Toda tú eres un paisaje entero<br>donde la prisa pierde su nombre<br>y el reloj decide detenerse.<br>— Anónimo",
    "Algunos monumentos están hechos de piedra.<br>Tú estás hecha de instantes,<br>y aún así, eres mucho más eterna.<br>— Anónimo"
  ];

  const poemElement = document.getElementById('random-poem');
  const btnNext = document.getElementById('btn-next-poem');
  let lastIndex = -1;

  btnNext.addEventListener('click', function() {
    let newIndex;
    do {
      newIndex = Math.floor(Math.random() * poems.length);
    } while (newIndex === lastIndex);
    
    lastIndex = newIndex;

    poemElement.classList.add('fade-out');
    
    setTimeout(() => {
      poemElement.innerHTML = poems[newIndex];
      poemElement.classList.remove('fade-out');
    }, 400);
  });

})();
</script>

</body>
</html>
